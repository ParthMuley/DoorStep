[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doorstep"
version = "0.1.0"
description = "DOORSTEP DEMO: synthetic-data simulation of accessible disaster-assistance coordination with Fetch.ai agents. Not an emergency service."
readme = "README.md"
requires-python = ">=3.11,<3.13"
# Owner: Developer A. Developer B requests dependency changes (package, version, reason).
dependencies = [
    "uagents==0.26.1",
    "uagents-core==0.4.12",
    "pydantic>=2,<3",
    "httpx>=0.27",
    "langgraph>=1.0",
    "sentry-sdk>=2",
    "python-dotenv>=1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pymongo>=4.6",
    "shapely>=2",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "mongomock>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"doorstep.agents" = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
